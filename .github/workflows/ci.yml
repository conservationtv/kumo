name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Validate changeset
        if: github.event_name == 'pull_request'
        run: vp exec tsx ci/scripts/validate-kumo-changeset.ts
        env:
          NO_CHANGESET_REQUIRED: ${{ contains(github.event.pull_request.labels.*.name, 'no-changeset-required') }}

      - name: Build package
        run: vp run build:kumo

      - name: Generate Figma data
        run: vp run gen:figma-data

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test package
        run: pnpm test

      - name: Test docs
        run: pnpm --filter @cloudflare/kumo-docs-astro test
